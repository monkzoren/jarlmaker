# Local SpacetimeDB for development (ADR 0006). Start it with `pnpm server:up`.
# The image tag must equal the exact `spacetimedb` version in
# packages/server/package.json; packages/server/test/pin.test.ts enforces it.
name: bastion

services:
  spacetimedb:
    image: clockworklabs/spacetime:v2.10.1
    # A fresh named volume is root-owned; the image's default user cannot write it.
    user: root
    # The JWT key pair lives in the volume, not the container's config dir, so
    # recreating the container keeps every issued token valid. `start`
    # generates the pair on first run when the files are missing.
    command:
      - start
      - --listen-addr
      - 0.0.0.0:3000
      - --data-dir
      - /stdb/data
      - --jwt-pub-key-path
      - /stdb/keys/id_ecdsa.pub
      - --jwt-priv-key-path
      - /stdb/keys/id_ecdsa
      - --non-interactive
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - bastion-stdb:/stdb
    restart: unless-stopped

volumes:
  bastion-stdb:
